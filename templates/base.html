{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MEDIGUARD{% endblock %}</title>

    <meta
        name="description"
        content="MEDIGUARD - Medical Intelligence, Screening, Referral and Follow-up Platform"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% block extra_css %}
    {% endblock %}
</head>

<body class="bg-light">

    <div class="d-flex flex-column min-vh-100">

        {% include "navbar.html" %}

        <div class="d-flex flex-grow-1">

            {% block sidebar %}
            {% endblock %}

            <main class="flex-grow-1">
                {% include "components/alerts.html" %}

                {% block content %}
                {% endblock %}
            </main>

        </div>

        {% include "footer.html" %}

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    {% block extra_js %}
    {% endblock %}

</body>
</html>

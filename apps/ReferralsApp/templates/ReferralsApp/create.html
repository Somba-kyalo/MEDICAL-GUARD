{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Referral | MEDIGUARD</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="{% static 'ReferralsApp/ReferralsApp.css' %}"
    >
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                MEDIGUARD
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/referrals/list/">
                    Referrals
                </a>
                <a class="nav-link" href="/referrals/tracking/">
                    Tracking
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="page-header mb-4">
            <h1 class="h3">Create Referral</h1>
            <p class="text-muted mb-0">
                Create a referral for a patient requiring additional care.
            </p>
        </div>

        <div
            id="referral-message"
            class="alert d-none"
            role="alert"
        ></div>

        <div class="card referral-form-card">
            <div class="card-body">
                <form id="referral-create-form">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="patient_id" class="form-label">
                                Patient ID
                            </label>
                            <input
                                type="number"
                                class="form-control"
                                id="patient_id"
                                name="patient_id"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="amr_record_id" class="form-label">
                                AMR Record ID
                            </label>
                            <input
                                type="number"
                                class="form-control"
                                id="amr_record_id"
                                name="amr_record_id"
                            >
                            <div class="form-text">
                                Optional.
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="referral_reason" class="form-label">
                                Referral Reason
                            </label>
                            <textarea
                                class="form-control"
                                id="referral_reason"
                                name="referral_reason"
                                rows="4"
                                required
                            ></textarea>
                        </div>

                        <div class="col-12">
                            <label for="clinical_summary" class="form-label">
                                Clinical Summary
                            </label>
                            <textarea
                                class="form-control"
                                id="clinical_summary"
                                name="clinical_summary"
                                rows="4"
                            ></textarea>
                        </div>

                        <div class="col-md-6">
                            <label for="destination_name" class="form-label">
                                Destination Facility
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="destination_name"
                                name="destination_name"
                                placeholder="Enter facility name"
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="priority" class="form-label">
                                Priority
                            </label>
                            <select
                                class="form-select"
                                id="priority"
                                name="priority"
                            >
                                <option value="ROUTINE">Routine</option>
                                <option value="URGENT">Urgent</option>
                                <option value="EMERGENCY">Emergency</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="referral_notes" class="form-label">
                                Referral Notes
                            </label>
                            <textarea
                                class="form-control"
                                id="referral_notes"
                                name="referral_notes"
                                rows="3"
                            ></textarea>
                        </div>

                    </div>

                    <div class="form-actions mt-4">
                        <a
                            href="/referrals/list/"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Create Referral
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <script src="{% static 'ReferralsApp/ReferralsApp.js' %}"></script>
</body>
</html>

{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Details | MEDIGUARD</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="{% static 'ReferralsApp/ReferralsApp.css' %}"
    >
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                MEDIGUARD
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/referrals/list/">
                    Referrals
                </a>
                <a class="nav-link" href="/referrals/tracking/">
                    Tracking
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="page-header mb-4">
            <a
                href="/referrals/list/"
                class="btn btn-sm btn-outline-secondary mb-3"
            >
                Back to Referrals
            </a>

            <h1 class="h3">Referral Details</h1>
            <p class="text-muted mb-0">
                Review referral information and update its status.
            </p>
        </div>

        <div
            id="referral-detail"
            data-referral-id="{{ referral_id }}"
        >
            <div class="text-center py-5">
                <div
                    class="spinner-border"
                    role="status"
                    aria-label="Loading referral"
                ></div>
                <p class="text-muted mt-3">
                    Loading referral...
                </p>
            </div>
        </div>
    </main>

    <script src="{% static 'ReferralsApp/ReferralsApp.js' %}"></script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unread Notifications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'NotificationsApp/NotificationsApp.css' %}">
</head>
<body>

<div class="container py-4">

    <div class="notification-header d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="page-title">Unread Notifications</h1>
            <p class="page-subtitle">Notifications that still require your attention.</p>
        </div>

        <div class="header-actions">
            <a href="{% url 'NotificationsApp:list' %}" class="btn btn-outline-secondary">
                All Notifications
            </a>

            <button type="button" class="btn btn-primary" id="mark-all-read-btn">
                Mark All as Read
            </button>
        </div>
    </div>

    <div id="notification-message"></div>

    <div class="notification-panel">
        <div class="panel-header d-flex justify-content-between align-items-center">
            <h2>Unread</h2>

            <button type="button" class="btn btn-sm btn-outline-secondary" id="refresh-btn">
                Refresh
            </button>
        </div>

        <div id="notifications-container">
            <div class="text-center py-5" id="loading-state">
                Loading unread notifications...
            </div>
        </div>
    </div>

</div>

<script src="{% static 'NotificationsApp/NotificationsApp.js' %}"></script>

</body>
</html>

{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Edit Patient | MEDIGUARD</title>

    <link rel="stylesheet" href="{% static 'css/PatientsApp/PatientsApp.css' %}">
</head>
<body>

<header>
    <nav>
        <a href="{% url 'core:home' %}">MEDIGUARD</a>

        <div>
            <a href="{% url 'PatientsApp:list' %}">Patients</a>
            <a href="{% url 'AccountsApp:profile' %}">Profile</a>
            <a href="{% url 'AccountsApp:logout' %}">Logout</a>
        </div>
    </nav>
</header>

<main class="patients-main">

    <section class="patients-section">
        <h1>Edit patient</h1>

        <p>
            Update the patient profile for
            {{ patient.user.username }}.
        </p>
    </section>

    {% if messages %}
        {% for message in messages %}
            <p class="patients-message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post" class="patients-form">
        {% csrf_token %}

        <div class="patients-field">
            <label for="username">Patient account</label>

            <input
                type="text"
                id="username"
                value="{{ patient.user.username }}"
                readonly
            >
        </div>

        <div class="patients-field">
            <label for="date_of_birth">Date of birth</label>

            <input
                type="date"
                id="date_of_birth"
                name="date_of_birth"
                value="{{ patient.date_of_birth|date:'Y-m-d' }}"
                required
            >
        </div>

        <div class="patients-field">
            <label for="sex">Sex</label>

            <select id="sex" name="sex" required>
                {% for value, label in sex_choices %}
                    <option
                        value="{{ value }}"
                        {% if patient.sex == value %}selected{% endif %}
                    >
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="patients-field">
            <label for="phone_number">Phone number</label>

            <input
                type="tel"
                id="phone_number"
                name="phone_number"
                value="{{ patient.phone_number }}"
                maxlength="20"
                required
            >
        </div>

        <div class="patients-field">
            <label for="address">Address</label>

            <input
                type="text"
                id="address"
                name="address"
                value="{{ patient.address }}"
                maxlength="255"
                required
            >
        </div>

        <div class="patients-field">
            <label for="emergency_contact_name">
                Emergency contact name
            </label>

            <input
                type="text"
                id="emergency_contact_name"
                name="emergency_contact_name"
                value="{{ patient.emergency_contact_name }}"
                maxlength="150"
                required
            >
        </div>

        <div class="patients-field">
            <label for="emergency_contact_phone">
                Emergency contact phone
            </label>

            <input
                type="tel"
                id="emergency_contact_phone"
                name="emergency_contact_phone"
                value="{{ patient.emergency_contact_phone }}"
                maxlength="20"
                required
            >
        </div>

        <div class="patients-form-actions">
            <button type="submit">Save Changes</button>

            <a href="{% url 'PatientsApp:detail' patient.id %}">
                Cancel
            </a>
        </div>
    </form>

</main>
<script src="{% static 'PatientsApp/PatientsApp.js' %}"></script>
</body>
</html>

{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Create Patient | MEDIGUARD</title>

    <link rel="stylesheet" href="{% static 'css/PatientsApp/PatientsApp.css' %}">
</head>
<body>

<header>
    <nav>
        <a href="{% url 'core:home' %}">MEDIGUARD</a>

        <div>
            <a href="{% url 'PatientsApp:list' %}">Patients</a>
            <a href="{% url 'AccountsApp:profile' %}">Profile</a>
            <a href="{% url 'AccountsApp:logout' %}">Logout</a>
        </div>
    </nav>
</header>

<main class="patients-main">

    <section class="patients-section">
        <h1>Create patient profile</h1>

        <p>
            Create a patient profile for an existing MEDIGUARD patient account.
        </p>
    </section>

    {% if messages %}
        {% for message in messages %}
            <p class="patients-message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post" class="patients-form">
        {% csrf_token %}

        <div class="patients-field">
            <label for="username">Patient account</label>

            <select id="username" name="username" required>
                <option value="">Select patient account</option>

                {% for user in users %}
                    <option value="{{ user.username }}">
                        {{ user.username }}
                        {% if user.first_name or user.last_name %}
                            — {{ user.first_name }} {{ user.last_name }}
                        {% endif %}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="patients-field">
            <label for="date_of_birth">Date of birth</label>

            <input
                type="date"
                id="date_of_birth"
                name="date_of_birth"
                required
            >
        </div>

        <div class="patients-field">
            <label for="sex">Sex</label>

            <select id="sex" name="sex" required>
                <option value="">Select sex</option>
                <option value="MALE">Male</option>
                <option value="FEMALE">Female</option>
            </select>
        </div>

        <div class="patients-field">
            <label for="phone_number">Phone number</label>

            <input
                type="tel"
                id="phone_number"
                name="phone_number"
                maxlength="20"
                required
            >
        </div>

        <div class="patients-field">
            <label for="address">Address</label>

            <input
                type="text"
                id="address"
                name="address"
                maxlength="255"
                required
            >
        </div>

        <div class="patients-field">
            <label for="emergency_contact_name">
                Emergency contact name
            </label>

            <input
                type="text"
                id="emergency_contact_name"
                name="emergency_contact_name"
                maxlength="150"
                required
            >
        </div>

        <div class="patients-field">
            <label for="emergency_contact_phone">
                Emergency contact phone
            </label>

            <input
                type="tel"
                id="emergency_contact_phone"
                name="emergency_contact_phone"
                maxlength="20"
                required
            >
        </div>

        <div class="patients-form-actions">
            <button type="submit">Create Patient</button>

            <a href="{% url 'PatientsApp:list' %}">
                Cancel
            </a>
        </div>
    </form>

</main>

</body>
</html>

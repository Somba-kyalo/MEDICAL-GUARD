{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility Details | MEDIGUARD</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'FacilitiesApp/FacilitiesApp.css' %}"
    >
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                MEDIGUARD
            </a>

            <div class="navbar-nav ms-auto">
                <a
                    class="nav-link"
                    href="{% url 'FacilitiesApp:list' %}"
                >
                    Facilities
                </a>

                <a
                    class="nav-link"
                    href="{% url 'FacilitiesApp:map' %}"
                >
                    Map
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="mb-4">
            <a
                href="{% url 'FacilitiesApp:list' %}"
                class="btn btn-sm btn-outline-primary mb-3"
            >
                ← Back to Facilities
            </a>

            <h1 class="page-title mb-1">Facility Details</h1>
            <p class="text-muted mb-0">
                Facility information, services and referral availability.
            </p>
        </div>

        <div id="facility-message" class="alert d-none" role="alert"></div>

        <div
            id="facility-detail"
            data-facility-id="{{ facility_id }}"
        >
            <div class="text-center py-5">
                <div
                    class="spinner-border"
                    role="status"
                >
                    <span class="visually-hidden">
                        Loading...
                    </span>
                </div>

                <p class="text-muted mt-3">
                    Loading facility details...
                </p>
            </div>
        </div>
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script
        src="{% static 'FacilitiesApp/FacilitiesApp.js' %}"
    ></script>
</body>
</html>

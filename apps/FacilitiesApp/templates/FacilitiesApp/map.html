{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility Map | MEDIGUARD</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'FacilitiesApp/FacilitiesApp.css' %}"
    >
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                MEDIGUARD
            </a>

            <div class="navbar-nav ms-auto">
                <a
                    class="nav-link"
                    href="{% url 'FacilitiesApp:list' %}"
                >
                    Facilities
                </a>

                <a
                    class="nav-link active"
                    href="{% url 'FacilitiesApp:map' %}"
                >
                    Map
                </a>

                <a
                    class="nav-link"
                    href="{% url 'FacilitiesApp:resources' %}"
                >
                    Resources
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="mb-4">
            <h1 class="page-title mb-1">Facility Locations</h1>
            <p class="text-muted mb-0">
                View healthcare facilities with available location coordinates.
            </p>
        </div>

        <div id="facility-message" class="alert d-none" role="alert"></div>

        <div class="card facility-card">
            <div class="card-body">
                <div id="facility-map-container" class="facility-map">
                    <div class="text-center py-5">
                        <div
                            class="spinner-border"
                            role="status"
                        >
                            <span class="visually-hidden">
                                Loading...
                            </span>
                        </div>

                        <p class="text-muted mt-3 mb-0">
                            Loading facility locations...
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card facility-card mt-4">
            <div class="card-body">
                <h4 class="mb-3">Facilities with Coordinates</h4>

                <div id="map-facilities-container">
                    <p class="text-muted mb-0">
                        Loading facilities...
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script
        src="{% static 'FacilitiesApp/FacilitiesApp.js' %}"
    ></script>
</body>
</html>

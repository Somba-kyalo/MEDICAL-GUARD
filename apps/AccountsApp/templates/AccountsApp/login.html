{% extends "base.html" %}
{% load static %}

{% block title %}
Login | MEDIGUARD
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/AccountsApp/AccountsApp.css' %}">
{% endblock %}

{% block content %}

<main class="accounts-main">

    <section class="accounts-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-8 col-lg-5">

                    <div class="card shadow-sm">

                        <div class="card-body p-4 p-md-5">

                            <div class="mb-4">

                                <h1 class="h2 fw-bold">
                                    Sign in
                                </h1>

                                <p class="text-secondary mb-0">
                                    Access your MEDIGUARD account.
                                </p>

                            </div>

                            <form method="post" class="accounts-form">

                                {% csrf_token %}

                                <div class="accounts-field mb-3">

                                    <label
                                        for="username"
                                        class="form-label"
                                    >
                                        Username
                                    </label>

                                    <input
                                        type="text"
                                        id="username"
                                        name="username"
                                        class="form-control"
                                        required
                                        autocomplete="username"
                                    >

                                </div>

                                <div class="accounts-field mb-4">

                                    <label
                                        for="password"
                                        class="form-label"
                                    >
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        id="password"
                                        name="password"
                                        class="form-control"
                                        required
                                        autocomplete="current-password"
                                    >

                                </div>

                                <button
                                    type="submit"
                                    class="btn btn-primary w-100"
                                >
                                    Sign in
                                </button>

                            </form>

                            <p class="accounts-links text-center mt-4 mb-0">

                                Don't have an account?

                                <a href="{% url 'AccountsApp:register' %}">
                                    Create one
                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>

{% endblock %}

{% block extra_js %}
<script src="{% static 'AccountsApp/AccountsApp.js' %}"></script>
{% endblock %}

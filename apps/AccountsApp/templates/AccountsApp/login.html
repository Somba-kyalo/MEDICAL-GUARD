{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MEDIGUARD</title>
    <link rel="stylesheet" href="{% static 'css/AccountsApp/AccountsApp.css' %}">
</head>

<body>

<header>
    <nav>
        <a href="{% url 'core:home' %}">MEDIGUARD</a>


    <div>
        <a href="{% url 'core:about' %}">About</a>
        <a href="{% url 'AccountsApp:register' %}">Register</a>
    </div>
</nav>


</header>

<main class="accounts-main">
    <section class="accounts-section">


    <h1>Sign in</h1>
    <p>Access your MEDIGUARD account.</p>

    {% if messages %}
        {% for message in messages %}
            <p class="accounts-message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post" class="accounts-form">
        {% csrf_token %}

        <div class="accounts-field">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                required
                autocomplete="username"
            >
        </div>

        <div class="accounts-field">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
            >
        </div>

        <button type="submit">Sign in</button>
    </form>

    <p class="accounts-links">
        Don't have an account?
        <a href="{% url 'AccountsApp:register' %}">Create one</a>
    </p>

</section>


</main>

</body>
</html>

{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MEDIGUARD</title>
    <link rel="stylesheet" href="{% static 'css/AccountsApp/AccountsApp.css' %}">
</head>

<body>

<header>
    <nav>
        <a href="{% url 'core:home' %}">MEDIGUARD</a>


    <div>
        <a href="{% url 'core:about' %}">About</a>
        <a href="{% url 'AccountsApp:login' %}">Login</a>
    </div>
</nav>


</header>

<main class="accounts-main">


<section class="accounts-section">
    <h1>Create account</h1>

    <p>
        Register as a patient to access MEDIGUARD.
    </p>

    {% if messages %}
        {% for message in messages %}
            <p class="accounts-message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post" class="accounts-form">
        {% csrf_token %}

        <div class="accounts-field">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                required
                autocomplete="username"
            >
        </div>

        <div class="accounts-field">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
            >
        </div>

        <div class="accounts-field">
            <label for="first_name">First name</label>

            <input
                type="text"
                id="first_name"
                name="first_name"
                autocomplete="given-name"
            >
        </div>

        <div class="accounts-field">
            <label for="last_name">Last name</label>

            <input
                type="text"
                id="last_name"
                name="last_name"
                autocomplete="family-name"
            >
        </div>

        <div class="accounts-field">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="new-password"
            >
        </div>

        <div class="accounts-field">
            <label for="confirm_password">Confirm password</label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
                autocomplete="new-password"
            >
        </div>

        <button type="submit">Create account</button>
    </form>

    <p class="accounts-links">
        Already have an account?
        <a href="{% url 'AccountsApp:login' %}">Sign in</a>
    </p>
</section>


</main>
<script src="{% static 'AccountsApp/AccountsApp.js' %}"></script>
</body>
</html>

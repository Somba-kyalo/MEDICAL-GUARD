{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Screening | MEDIGUARD</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/ScreeningApp/ScreeningApp.css' %}"
    >
</head>

<body>

<div class="container py-5">

    <div class="mb-4">
        <h1>Start Screening</h1>
        <p class="text-secondary">
            Begin a new patient health screening.
        </p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="patient_id" class="form-label">
                        Patient
                    </label>

                    <select
                        class="form-select"
                        id="patient_id"
                        name="patient_id"
                        required
                    >
                        <option value="">Select patient</option>

                        {% for patient in patients %}
                            <option value="{{ patient.id }}">
                                {{ patient.user.get_full_name|default:patient.user.username }}
                            </option>
                        {% empty %}
                            <option value="" disabled>
                                No patients available
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="screening_type" class="form-label">
                        Screening Type
                    </label>

                    <select
                        class="form-select"
                        id="screening_type"
                        name="screening_type"
                        required
                    >
                        {% for value, label in screening_types %}
                            <option value="{{ value }}">
                                {{ label }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label for="chief_complaint" class="form-label">
                        Chief Complaint
                    </label>

                    <textarea
                        class="form-control"
                        id="chief_complaint"
                        name="chief_complaint"
                        rows="4"
                        placeholder="Describe the patient's main complaint or reason for screening."
                    ></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Start Screening
                    </button>

                    <a
                        href="{% url 'ScreeningApp:list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
